<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/stileiras/estilosG.css">
    <title>Tela Inicial</title>
</head>
<body>
    <!-- Menu lateral -->
    <aside class="sidebar">

        <div class="logo">
            <img src="src/stileiras/img/logoFundoBranco.png" alt="logo">
        </div>
        <nav class="menu-lateral"><!--Navegação-->
            <!--Tela inicial-->
            <button onclick="window.location.href='telaInicialA.html'">
                <img src="src/stileiras/img/home.png" alt="Home">
                <span>Início</span>
            </button>

            <!--Relatórios-->
            <button onclick="window.location.href='relatoriosA.html'">
                <img src="src/stileiras/img/Grafico.png" alt="Relatórios">
                <span>Relatórios</span>
            </button>

            <!--Perfil-->
            <button onclick="window.location.href='perfilA.html'">
                <img src="src/stileiras/img/perfil.png" alt="Perfil">
                <span>Perfil</span>
            </button>

            <!--Solicitações-->
            <button onclick="window.location.href='solicitações.html'">
                <img src="src/stileiras/img/solicitacoes.png" alt="solicitacoes">
                <span>Solicitações</span>
            </button>

        </nav>

    </aside>

    <!-- Conteúdo principal -->
    <main class="conteudo">

        <h1>Bem-Vinda, <span id="nome"></span>!</h1>

        <!-- Cards -->
        <section class="cards">

            <div class="card">
                <h2>Restaurantes Cadastrados</h2>
                <span id="nRestau"></span>
            </div>

            <div class="card">
                <h2>Solicitações de Parceria</h2>
                <span id="parcerias"></span>
            </div>

            <div class="card">
                <h2>Cidades Atendidas</h2>
                <span id="nCidades"></span>
            </div>

        </section>

        <!-- Botões -->
        <section class="acoes">

            <button id="addR">Adicionar Restaurante</button>
            
            <button id="edtR">Editar  Restaurante</button>

            <button id="addC">Adicionar centro de apoio</button>

            <button id="editarCentro">Editar info. dos centros de apoio</button>

        </section>

        <!-- Tabela -->
        <section class="tabela">

            <h2>Restaurantes cadastrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>Horário</th>
                        <th>Paciente</th>
                        <th>Tipo</th>
                        <th>Nível</th>
                    </tr>
                </thead>

                <tbody id="listaAtendimentos">

                    <tr>
                        <td>11:00</td>
                        <td>Anônimo</td>
                        <td>Via Chat</td>
                        <td>Urgente</td>
                    </tr>

                    <tr>
                        <td>13:00</td>
                        <td>Ana Silva</td>
                        <td>Chamada de vídeo</td>
                        <td>Médio</td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>
    <script src="telaInicialA.js"></script>
</body>
</html>
