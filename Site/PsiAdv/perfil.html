<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/stileiras/estilosG.css">

    <title>Perfil</title>
</head>
<body>
    <!-- Menu lateral -->
    <aside class="sidebar">
        <div class="logo">
            <img src="src/stileiras/img/logoFundoBranco.png" alt="logo">
        </div>
        <nav class="menu-lateral"><!--Navegação-->
            <!--Tela Inicial-->
            <button onclick="window.location.href='telaInicial.html'">
                <img src="src/stileiras/img/home.png" alt="Home">
                <span>Início</span>
            </button>
            <!--Relatórios-->
            <button onclick="window.location.href='relatorios.html'">
                <img src="src/stileiras/img/Grafico.png" alt="Relatórios">
                <span>Relatórios</span><!---->
            </button>
            <!--Mensagens-->
            <button onclick="window.location.href='mensagens.html'">
                <img src="src/stileiras/img/chat.png" alt="Mensagens">
                <span>Mensagens</span>
            </button>
            <!--Perfil-->
            <button onclick="window.location.href='perfil.html'">
                <img src="src/stileiras/img/perfil.png" alt="Perfil">
                <span>Perfil</span>
            </button>
        </nav>
    </aside>

    <main class="conteudo">

        <h1>Bem-Vinda ao seu Perfil!</h1>

        <!-- Cards -->
        <section class="cardsP">
            <h2>Identificação</h2>
            <div class="cardP identificacao">
                <div class="fotoAcoes">
                    <img src="src/stileiras/img/SemFotoPerfil.jpg" alt="Foto de perfil" class="fotoPerfil">
                    <img src="src/stileiras/img/camera.png" alt="camera" class="img">
                    <a href="" class="littleBotoes">Alterar foto?</a>
                </div>
                <h2 id="nomePerfil"></h2>
            </div>
            
            <h2>Informações</h2>
            <div class="cardP">
                <div class="info identificacao">
                    <span>Nome:</span>
                    <p id="nome"></p>
                </div>

                <div class="info identificacao">
                    <span>CPF:</span>
                    <p id="cpf"></p>
                </div>

                <div class="info identificacao">
                    <span>Email:</span>
                    <p id="email"></p>
                </div>

                <div class="info identificacao">
                    <span>Telefone:</span>
                    <p id="telefone"></p>
                </div>
                <section class="acoesP">
                    <button>Aterar Informações</button>
                </section>
            </div>
        </section>
        <section class="acoesP">
            <button onclick="deslogar()">Sair</button>
            <button onclick="excluirConta()">Apagar Conta</button>
        </section>
        
        
    </main>
    <script src="/TemperoCaseiro1/Site/perfil.js"></script>
</body>
</html>
