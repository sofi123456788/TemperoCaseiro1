<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/stileiras/estilosG.css">
    <title>Editar Centro de Apoio</title>
</head>
<body>
    <!-- Menu lateral -->
    <aside class="sidebar">

        <div class="logo">
            <img src="src/stileiras/img/logoFundoBranco.png" alt="logo">
        </div>
        <nav class="menu-lateral"><!--Navegação-->
            <button onclick="window.location.href='telaInicial.html'">
                <img src="src/stileiras/img/home.png" alt="Home">
                <span>Início</span>
            </button>

            <button onclick="window.location.href='relatorios.html'">
                <img src="src/stileiras/img/Grafico.png" alt="Relatórios">
                <span>Relatórios</span><!---->
            </button>

            <button onclick="window.location.href='mensagens.html'">
                <img src="src/stileiras/img/chat.png" alt="Mensagens">
                <span>Mensagens</span>
            </button>

            <button onclick="window.location.href='perfil.html'">
                <img src="src/stileiras/img/perfil.png" alt="Perfil">
                <span>Perfil</span>
            </button>

        </nav>

    </aside>
    <!--Lista de canais-->
    <aside class="sidebarLista">
        <h1 id="form_titulo">Escolha o canal</h1>
        <ul id="listaCentros" onclick="pegarInfosCentro()"></ul>
    </aside>

    <!--Edição do Canal de Apoio-->
    <div class="conteudo-form">
        <div id="form_headerL">
            <h1>Alterar Centro de Apoio</h1>
            <h2>Informações do Centro</h2>
        </div>
        <form id="container">
            <div id="input_container">
                <div class="input-box">
                    <label for="nome" class="form-label">Nome do Centro de Apoio</label>
                    <input type="text" id="nomeCentro" class="form-controll" placeholder="Insira o nome">
                </div>
                <div class="input-box">
                    <label for="telefone" class="form-label">Telefone para Contato</label>
                    <input type="text" id="telefoneCentro" class="form-controll" placeholder="(12)34567-8901">
                </div>
                <div class="input-box">
                    <label for="email" class="form-label">Email para Contato</label>
                    <input type="text" id="emailCentro" class="form-controll" placeholder="local@gmail.com">
                </div>
                <div class="input-box">
                    <label for="rua" class="form-label">Rua</label>
                    <input type="text" id="ruaCentro" class="form-controll" placeholder="Nome da rua">
                </div>
                 <div class="input-box">
                    <label for="logradouro" class="form-label">Logradouro</label> 
                    <input type="text" id="logradouroCentro" class="form-controll" placeholder="1234">
                </div>  
                <div class="input-box">
                    <label for="bairro" class="form-label">Bairro</label>
                    <input type="text" id="bairroCentro" class="form-controll" placeholder="Insira o nome do bairro">
                </div>
                <div class="input-box">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text" id="cidadeCentro" class="form-controll" placeholder="Insira o nome da cidade">
                </div>
                <div class="input-box">
                    <label for="estado" class="form-label">Estado</label>
                    <select name="estado" id="estadoCentro" class="selectTopziera">
                        <option value="nulo">     </option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espirito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato grosso do sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="CE">Ceará</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </div>
                <div class="input-box">
                    <label for="horaA" class="form-label">Horário de Abertura</label>
                    <input type="time" id="horaACentro" class="form-controll" placeholder="07:00">
                </div>
                <div class="input-box">
                    <label for="horaF" class="form-label">Horário de Encerramento</label>
                    <input type="time" id="horaFCentro" class="form-controll" placeholder="17:00">
                </div>
                <label for="modo" class="form-label">Modo de Atendimento</label>
                <!--Tipo de Centro-->
                <select name="tipo" id="tipoCentro" class="selectTopziera">
                    <option value="nulo">     </option>
                    <option value="Casa de Acolhimento">Casa de Acolhimento</option>
                    <option value="Delegacia da Mulher">Delegacia da Mulher</option>
                    <option value="Centro de Apoio a Mulher">Centro de Apoio a Mulher</option>
                </select>
            </div>
            <button type="submit" class="btn-default" onclick="alterarInfosCentro()">Alterar Centro</button>
            <button type="submit" class="btn-default" onclick="excluirCentro()">Apagar Centro</button>
        </form>  
    </div>
    <script src="editarCentroApoio.js"></script>
</body>
</html>
